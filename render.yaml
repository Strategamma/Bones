services:
  - type: web
    name: skull-internet-table
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: TABLE_MODE
        value: internet
      - key: NODE_VERSION
        value: 22
